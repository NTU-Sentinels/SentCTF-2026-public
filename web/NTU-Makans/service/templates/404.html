<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>404 - Menu Not Found</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f5f0;
            color: #292929;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-container {
            width: 90%;
            max-width: 650px;

            background: white;

            padding: 45px;

            border-radius: 12px;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        .error-code {
            font-size: 70px;
            font-weight: bold;
            color: #b6402d;

            margin-bottom: 10px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 12px;
        }

        .message {
            color: #777;
            margin-bottom: 30px;
        }

        .error-box {
            text-align: left;

            background: #292929;

            color: #f5f5f5;

            padding: 20px;

            border-radius: 7px;

            font-family: monospace;

            overflow-x: auto;
        }

        .error-label {
            color: #aaa;
            font-family: Arial, Helvetica, sans-serif;

            font-size: 13px;

            margin-bottom: 10px;
        }

        .error {
            font-size: 14px;
        }

        .back-button {
            display: inline-block;

            margin-top: 25px;

            padding: 11px 20px;

            background: #b6402d;

            color: white;

            text-decoration: none;

            border-radius: 7px;

            font-weight: bold;
        }

        .back-button:hover {
            background: #963322;
        }

    </style>

</head>


<body>

    <div class="error-container">
        <div class="error-code">
            404
        </div>
        <h1>
            Menu Not Found
        </h1>

        <p class="message">
            The requested menu could not be found.
        </p>
        <div class="error-box">

            <div class="error-label">
                Error received
            </div>

            <div class="error">
                {{ error }}
            </div>

        </div>

        <a href="/" class="back-button">
            Return to Menu
        </a>

    </div>

</body>

</html>
