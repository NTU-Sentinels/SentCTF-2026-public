server {
    listen 80;
    server_name _;

    # Block Keycloak admin console and master realm from public challenge access.
    location ^~ /idp/admin/ {
        return 404;
    }

    location ^~ /idp/realms/master/ {
        return 404;
    }

    # Only allow the challenge realm for IdP traffic.
    location ~ ^/idp/realms/(?!ntu-sentinels/).* {
        return 404;
    }

    # Static assets required by Keycloak login pages.
    location ^~ /idp/resources/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 49155;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /idp;
    }

    # Allow only challenge realm endpoints used by SAML login/logout flow.
    location ^~ /idp/realms/ntu-sentinels/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 49155;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /idp;
    }

    # Deny any other IdP paths by default.
    location /idp/ {
        return 404;
    }

    location / {
        proxy_pass http://sp-flask:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}