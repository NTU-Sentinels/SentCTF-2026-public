name: "Prime Suspects: Part 2"
author: "Mujabeast"
attribution: "Mujabeast"
category: "Crypto"
description: |
  Two RSA public keys were generated by the same faulty service. They should be independent, but the service reused part of its key material.

  Recover the protected message and submit the flag.

  Flag format: sentctf{...}

value: 200
type: standard
state: hidden

flags:
  - sentctf{gcd_br34k5_r3u53d_r54}

files:
  - dist/captured_keys.txt

hints:
  - content: "Compare the two RSA moduli with math.gcd(n_a, n_b)."
    cost: 0
  - content: "A non-trivial GCD is a shared prime. Use it to factor the target modulus and reconstruct its private key."
    cost: 0
