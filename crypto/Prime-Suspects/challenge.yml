category: "Crypto"
description: |
  An archived RSA message was stored together with its key-generation values.

  Recover the plaintext and submit the flag.

  Flag format: sentctf{...}

value: 100
type: standard
state: hidden

flags:
  - sentctf{f4ct0r5_bu1ld_th3_k3y}

